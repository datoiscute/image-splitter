<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>圖片切割工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --surface2: #f0efe9;
    --border: #e2e0d8; --text: #1a1917; --muted: #7a7870;
    --accent: #2d2cff; --accent-soft: #eeeeff;
    --success: #16a34a; --success-soft: #dcfce7;
    --radius: 16px; --radius-sm: 10px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem 6rem; }
  .wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  header { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 44px; height: 44px; background: var(--text); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .logo h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
  .logo p { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .num-group { display: flex; align-items: center; gap: 6px; }
  .num-group label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .num-group input { width: 52px; height: 36px; text-align: center; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface2); font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; color: var(--text); outline: none; transition: border-color .2s; }
  .num-group input:focus { border-color: var(--accent); }
  button { font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 16px; height: 36px; cursor: pointer; background: var(--surface); color: var(--text); transition: all .15s; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button:hover { background: var(--surface2); }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--text); color: #fff; border-color: var(--text); }
  button.primary:hover { background: #333; }
  button.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.accent:hover { background: #1a19e0; }
  button.ghost { background: transparent; border-color: var(--border); color: var(--muted); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius); padding: 2rem; max-width: 480px; width: 100%; display: flex; flex-direction: column; gap: 16px; }
  .modal h2 { font-size: 16px; font-weight: 800; }
  .modal label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
  .modal input { width: 100%; height: 38px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 12px; font-family: 'DM Mono', monospace; font-size: 13px; background: var(--surface2); color: var(--text); outline: none; }
  .modal input:focus { border-color: var(--accent); }
  .modal .hint { font-size: 11px; color: var(--muted); line-height: 1.6; background: var(--surface2); padding: 12px; border-radius: var(--radius-sm); }
  .modal .hint a { color: var(--accent); }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; }
  #empty { border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 5rem 2rem; text-align: center; cursor: pointer; transition: all .2s; background: var(--surface); }
  #empty:hover { border-color: var(--accent); background: var(--accent-soft); }
  #empty .icon { font-size: 48px; margin-bottom: 1rem; opacity: 0.3; }
  #empty p { color: var(--muted); font-size: 15px; font-weight: 600; }
  #empty small { color: var(--muted); font-size: 12px; opacity: 0.7; }
  #preview-wrap { display: none; background: #1a1917; border-radius: var(--radius); padding: 2rem; align-items: center; justify-content: center; min-height: 300px; }
  #img-container { position: relative; display: inline-block; user-select: none; box-shadow: 0 8px 40px rgba(0,0,0,0.4); }
  #pimg { max-width: 100%; max-height: 60vh; display: block; pointer-events: none; }
  #lines-layer { position: absolute; inset: 0; }
  .h-line-hit { position: absolute; left: 0; right: 0; height: 14px; transform: translateY(-50%); cursor: row-resize; z-index: 10; }
  .h-line-hit::after { content: ''; position: absolute; inset-x: 0; top: 50%; border-top: 2px dashed rgba(255,255,255,0.7); transform: translateY(-50%); pointer-events: none; }
  .h-line-hit:hover::after { border-color: #fff; }
  .v-line-hit { position: absolute; top: 0; bottom: 0; width: 14px; transform: translateX(-50%); cursor: col-resize; z-index: 10; }
  .v-line-hit::after { content: ''; position: absolute; inset-y: 0; left: 50%; border-left: 2px dashed rgba(255,255,255,0.7); transform: translateX(-50%); pointer-events: none; }
  .v-line-hit:hover::after { border-color: #fff; }
  #result { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; }
  #result h2 { font-size: 16px; font-weight: 800; margin-bottom: 1.25rem; }
  #tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .tile-card { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface2); display: flex; flex-direction: column; }
  .tile-img { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #fff; padding: 8px; border-bottom: 1px solid var(--border); }
  .tile-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .tile-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .tile-label { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; text-align: center; }
  .tile-actions { display: flex; gap: 6px; }
  .tile-actions button { flex: 1; height: 30px; font-size: 11px; padding: 0 6px; }
  .link-box { display: none; background: var(--success-soft); border: 1px solid #bbf7d0; border-radius: 8px; padding: 6px 8px; align-items: center; gap: 6px; }
  .link-box span { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--success); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-box button { flex: none; height: 24px; font-size: 10px; padding: 0 8px; }
  #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 20px; border-radius: 100px; font-size: 13px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 999; white-space: nowrap; max-width: 90vw; text-overflow: ellipsis; overflow: hidden; }
  #toast.show { opacity: 1; }
  .setup-banner { background: #fffbeb; border: 1px solid #fde68a; border-radius: var(--radius); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-size: 13px; color: #92400e; }
  .setup-banner strong { font-weight: 800; }
</style>
</head>
<body>
<div class="wrap">
  <div class="modal-bg" id="settingsModal">
    <div class="modal">
      <h2>⚙️ GitHub 設定</h2>
      <div class="hint">
        需要先取得 GitHub Personal Access Token：<br/>
        1. 前往 <a href="https://github.com/settings/tokens/new" target="_blank">github.com/settings/tokens/new</a><br/>
        2. Note 填任意名稱，Expiration 選 <strong>No expiration</strong><br/>
        3. 勾選 <strong>repo</strong> 權限 → Generate token → 複製
      </div>
      <div>
        <label>GitHub Token（ghp_...）</label>
        <input type="password" id="inp_token" placeholder="ghp_xxxxxxxxxxxxxxxxxx"/>
      </div>
      <div>
        <label>GitHub 帳號名稱</label>
        <input type="text" id="inp_user" placeholder="your-username"/>
      </div>
      <div>
        <label>Repo 名稱（預設 image-splitter）</label>
        <input type="text" id="inp_repo" placeholder="image-splitter"/>
      </div>
      <div class="modal-footer">
        <button class="ghost" onclick="closeSettings()">取消</button>
        <button class="primary" onclick="saveSettings()">儲存設定</button>
      </div>
    </div>
  </div>
  <header>
    <div class="logo">
      <div class="logo-icon">✂</div>
      <div>
        <h1>圖片切割工具</h1>
        <p>切割 → GitHub 永久存圖 → 短網址</p>
      </div>
    </div>
    <div class="controls">
      <div class="num-group">
        <label>列</label>
        <input type="number" id="rows" value="2" min="1" max="20" oninput="initLines()"/>
      </div>
      <div class="num-group">
        <label>行</label>
        <input type="number" id="cols" value="5" min="1" max="20" oninput="initLines()"/>
      </div>
      <button class="ghost" onclick="openSettings()">⚙ 設定</button>
      <button onclick="document.getElementById('fi').click()">上傳圖片</button>
      <button class="primary" id="splitBtn" onclick="doSplit()" style="display:none">✂ 立即切割</button>
    </div>
    <input type="file" id="fi" accept="image/*" style="display:none" onchange="loadImg(event)"/>
  </header>
  <div class="setup-banner" id="setupBanner" style="display:none">
    <span>⚠ <strong>尚未設定 GitHub Token</strong>，短網址功能需要先設定才能使用。</span>
    <button class="primary" onclick="openSettings()">立即設定</button>
  </div>
  <div id="empty" onclick="document.getElementById('fi').click()">
    <div class="icon">🖼</div>
    <p>點擊上傳圖片</p>
    <small>支援 JPG、PNG、WebP、GIF</small>
  </div>
  <div id="preview-wrap">
    <div id="img-container">
      <img id="pimg"/>
      <div id="lines-layer"></div>
    </div>
  </div>
  <div id="result">
    <h2>切割結果</h2>
    <div id="tiles"></div>
  </div>
</div>
<div id="toast"></div>
<script>
let GH_TOKEN = localStorage.getItem('gh_token') || '';
let GH_USER  = localStorage.getItem('gh_user')  || '';
let GH_REPO  = localStorage.getItem('gh_repo')  || 'image-splitter';
let imgObj = null, hL = [], vL = [], tileData = [], drag = null;
window.addEventListener('load', () => {
  if (!GH_TOKEN || !GH_USER) document.getElementById('setupBanner').style.display = 'flex';
});
function openSettings() {
  document.getElementById('inp_token').value = GH_TOKEN;
  document.getElementById('inp_user').value  = GH_USER;
  document.getElementById('inp_repo').value  = GH_REPO;
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
function saveSettings() {
  GH_TOKEN = document.getElementById('inp_token').value.trim();
  GH_USER  = document.getElementById('inp_user').value.trim();
  GH_REPO  = document.getElementById('inp_repo').value.trim() || 'image-splitter';
  localStorage.setItem('gh_token', GH_TOKEN);
  localStorage.setItem('gh_user',  GH_USER);
  localStorage.setItem('gh_repo',  GH_REPO);
  closeSettings();
  document.getElementById('setupBanner').style.display = 'none';
  toast('✓ 設定已儲存！');
}
function toast(msg, ms = 3500) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms);
}
function loadImg(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      imgObj = img;
      document.getElementById('pimg').src = img.src;
      document.getElementById('empty').style.display = 'none';
      document.getElementById('preview-wrap').style.display = 'flex';
      document.getElementById('splitBtn').style.display = 'inline-flex';
      document.getElementById('result').style.display = 'none';
      tileData = []; initLines();
      toast('圖片已載入，拖曳虛線調整切割位置');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function initLines() {
  const r = Math.max(1, parseInt(document.getElementById('rows').value) || 2);
  const c = Math.max(1, parseInt(document.getElementById('cols').value) || 5);
  hL = Array.from({ length: r + 1 }, (_, i) => (i / r) * 100);
  vL = Array.from({ length: c + 1 }, (_, i) => (i / c) * 100);
  renderLines();
}
function renderLines() {
  const layer = document.getElementById('lines-layer'); layer.innerHTML = '';
  hL.forEach((p, i) => {
    if (i === 0 || i === hL.length - 1) return;
    const el = document.createElement('div'); el.className = 'h-line-hit'; el.style.top = p + '%';
    el.addEventListener('mousedown', ev => { ev.preventDefault(); drag = { t: 'h', i }; });
    layer.appendChild(el);
  });
  vL.forEach((p, i) => {
    if (i === 0 || i === vL.length - 1) return;
    const el = document.createElement('div'); el.className = 'v-line-hit'; el.style.left = p + '%';
    el.addEventListener('mousedown', ev => { ev.preventDefault(); drag = { t: 'v', i }; });
    layer.appendChild(el);
  });
}
document.addEventListener('mousemove', e => {
  if (!drag) return;
  const rect = document.getElementById('img-container').getBoundingClientRect();
  if (drag.t === 'h') { let p = ((e.clientY - rect.top) / rect.height) * 100; p = Math.max(1, Math.min(99, p)); hL[drag.i] = p; hL.sort((a,b)=>a-b); }
  else { let p = ((e.clientX - rect.left) / rect.width) * 100; p = Math.max(1, Math.min(99, p)); vL[drag.i] = p; vL.sort((a,b)=>a-b); }
  renderLines();
});
document.addEventListener('mouseup', () => drag = null);
function doSplit() {
  if (!imgObj) return; tileData = [];
  const cv = document.createElement('canvas'); const ctx = cv.getContext('2d');
  for (let r = 0; r < hL.length - 1; r++) {
    for (let c = 0; c < vL.length - 1; c++) {
      const sx=(vL[c]/100)*imgObj.width, ex=(vL[c+1]/100)*imgObj.width;
      const sy=(hL[r]/100)*imgObj.height, ey=(hL[r+1]/100)*imgObj.height;
      cv.width=Math.round(ex-sx); cv.height=Math.round(ey-sy);
      ctx.drawImage(imgObj,sx,sy,cv.width,cv.height,0,0,cv.width,cv.height);
      tileData.push({dataUrl:cv.toDataURL('image/png'),row:r+1,col:c+1,shortUrl:null});
    }
  }
  renderTiles(); toast(`已切割成 ${tileData.length} 塊`);
}
function renderTiles() {
  const container = document.getElementById('tiles'); container.innerHTML = '';
  document.getElementById('result').style.display = 'block';
  tileData.forEach((tile, idx) => {
    const card = document.createElement('div'); card.className = 'tile-card';
    card.innerHTML = `
      <div class="tile-img"><img src="${tile.dataUrl}"/></div>
      <div class="tile-body">
        <div class="tile-label">R${tile.row} · C${tile.col}</div>
        <div class="tile-actions">
          <button onclick="dl(${idx})">下載</button>
          <button class="accent" id="sb_${idx}" onclick="getLink(${idx})">短網址</button>
        </div>
        <div class="link-box" id="lb_${idx}">
          <span id="lt_${idx}"></span>
          <button onclick="cp(${idx})">複製</button>
        </div>
      </div>`;
    container.appendChild(card);
  });
}
function dl(idx) { const a=document.createElement('a'); a.href=tileData[idx].dataUrl; a.download=`tile_R${tileData[idx].row}C${tileData[idx].col}.png`; a.click(); }
async function uploadToGitHub(base64, filename) {
  if (!GH_TOKEN || !GH_USER) { openSettings(); throw new Error('請先設定 GitHub Token 和帳號'); }
  const path = `tiles/${Date.now()}_${filename}`;
  const res = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${path}`, {
    method: 'PUT',
    headers: { 'Authorization': `token ${GH_TOKEN}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
    body: JSON.stringify({ message: `Add ${filename}`, content: base64 })
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(`GitHub 上傳失敗 (${res.status}): ${e.message||'請檢查 Token 和 Repo'}`); }
  return `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/${path}`;
}
async function shortenUrl(url) {
  try { const r=await fetch('https://tinyurl.com/api-create.php?url='+encodeURIComponent(url)); const t=await r.text(); if(t.trim().startsWith('http')) return t.trim(); } catch(e) {}
  return url;
}
async function getLink(idx) {
  if (tileData[idx].shortUrl) { cp(idx); return; }
  if (!GH_TOKEN || !GH_USER) { openSettings(); return; }
  const btn = document.getElementById(`sb_${idx}`);
  btn.textContent = '上傳中...'; btn.disabled = true;
  try {
    const base64 = tileData[idx].dataUrl.split(',')[1];
    toast('正在上傳至 GitHub...');
    const rawUrl = await uploadToGitHub(base64, `R${tileData[idx].row}C${tileData[idx].col}.png`);
    toast('正在產生短網址...');
    const shortUrl = await shortenUrl(rawUrl);
    tileData[idx].shortUrl = shortUrl;
    document.getElementById(`lt_${idx}`).textContent = shortUrl;
    document.getElementById(`lb_${idx}`).style.display = 'flex';
    btn.textContent = '✓ 已完成'; btn.disabled = false;
    try { await navigator.clipboard.writeText(shortUrl); toast('✓ 短網址已複製！'); }
    catch { toast('短網址已產生，請點複製按鈕'); }
  } catch (err) {
    console.error(err); btn.textContent = '短網址'; btn.disabled = false;
    toast('❌ ' + err.message);
  }
}
function cp(idx) {
  const url = tileData[idx].shortUrl; if (!url) return;
  navigator.clipboard.writeText(url).then(()=>toast('✓ 已複製！')).catch(()=>{
    const el=document.createElement('textarea'); el.value=url; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); toast('✓ 已複製！');
  });
}
</script>
</body>
</html>
